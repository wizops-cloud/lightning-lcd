name: Release

# CD : une étiquette v* (posée par scripts/release.sh tag) construit les binaires x86_64,
# les atteste et crée une release EN BROUILLON avec les notes du CHANGELOG. La publication
# reste une décision humaine : scripts/release.sh publish. Processus complet : RELEASING.md.
# Lancement manuel (workflow_dispatch) : construction et archive seulement, sans release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Ubuntu 24.04 : GTK 4.14 et libadwaita 1.5, les versions minimales de l'application.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          crate=$(scripts/check-version.sh)
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$crate-dev.${GITHUB_SHA::7}"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # Préversion (v0.2.0-rc.1) : même base que le Cargo.toml, release marquée « pre-release ».
            version=${GITHUB_REF_NAME#v}
            [[ "${version%%-*}" == "$crate" ]] || { echo "::error::étiquette $GITHUB_REF_NAME : la version du Cargo.toml est $crate"; exit 1; }
          else
            version=$(scripts/check-version.sh "$GITHUB_REF_NAME")
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: L'étiquette désigne un commit de main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME n'est pas sur main"; exit 1; }
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libgtk-4-dev libadwaita-1-dev dbus-daemon
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release --locked
      - run: cargo build --release --locked -p lightning -p lightning-gtk
      - name: Les binaires annoncent la bonne version
        run: |
          crate=$(scripts/check-version.sh)
          [[ "$(target/release/lightning --version)" == "lightning $crate" ]]
          [[ "$(target/release/lightning-settings --version)" == "lightning-settings $crate" ]]
      - name: Archive et sommes SHA-256
        run: scripts/package-archive.sh "${{ steps.version.outputs.version }}" target/release dist
      - name: Attestation de provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/lightning
            dist/lightning-settings
      - uses: actions/upload-artifact@v4
        with:
          name: lightning-lcd-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          {
            scripts/release-notes.sh "${VERSION%%-*}"
            cat <<EOF

          ## Install

          x86_64 binaries (glibc ≥ 2.39, GTK ≥ 4.14, libadwaita ≥ 1.5).

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          tar xf lightning-lcd-$VERSION-x86_64-linux.tar.gz && cd lightning-lcd-$VERSION-x86_64-linux
          ./install.sh            # see ./install.sh --help
          \`\`\`

          Build provenance: \`gh attestation verify lightning-lcd-$VERSION-x86_64-linux.tar.gz --repo $GITHUB_REPOSITORY\`

          SHA-256:
          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF
          } >notes.md
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            "${prerelease[@]}" --title "lightning-lcd $VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/lightning dist/lightning-settings dist/SHA256SUMS
