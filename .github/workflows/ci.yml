name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libgtk-4-dev libadwaita-1-dev dbus-daemon libheif-dev libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Photos HEIC : fonctionnalité facultative, construite et testée à part.
      - run: cargo clippy -p lightning --features heic --all-targets -- -D warnings
      - run: cargo test -p lightning --features heic
