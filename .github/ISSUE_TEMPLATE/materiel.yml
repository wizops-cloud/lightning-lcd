name: Retour sur un matériel non testé
description: Votre carte a un écran 0db0:7880 à 0db0:7919 autre que 0db0:7881 ? Dites-nous ce qui marche.
labels: ["matériel"]
body:
  - type: markdown
    attributes:
      value: |
        Seul l'écran `0db0:7881` (MSI RTX 5090 Lightning Z) a été testé. Les autres identifiants
        déclarés par le pilote Windows ne sont pilotés qu'avec `--any-supported-pid` (ou
        `any_supported_pid = true` dans `[output]`). Retirez toute donnée personnelle (nom de
        machine, chemins `/home/…`, numéros de série).

        **Ne tentez rien d'autre que les commandes ci-dessous** : lightning n'écrit jamais dans
        la mémoire flash de l'écran.
  - type: input
    id: carte
    attributes:
      label: Modèle exact de la carte graphique
      placeholder: MSI GeForce RTX 50xx … 
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: Identifiant USB de l'écran
      description: "Sortie de `lsusb -d 0db0:` (VID:PID, sans numéro de série)."
      placeholder: "ID 0db0:78xx Micro Star International …"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: État du firmware
      description: "Sortie de `lightning --any-supported-pid status` (service arrêté), sans la ligne du numéro de série."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: essais
    attributes:
      label: Ce qui fonctionne
      description: "Avec `--any-supported-pid` et le service arrêté."
      options:
        - label: "`lightning --any-supported-pid color ff0000` affiche du rouge"
        - label: "`lightning --any-supported-pid dashboard` affiche le tableau de bord"
        - label: "`lightning --any-supported-pid brightness 50` change la luminosité"
        - label: "`lightning --any-supported-pid restore` rend l'animation d'origine"
        - label: La résolution de l'écran est bien 1280 × 800
  - type: input
    id: resolution
    attributes:
      label: Résolution réelle de l'écran (si différente)
  - type: textarea
    id: journaux
    attributes:
      label: Journaux
      description: "La commande qui pose problème relancée avec `-vv`."
      render: text
  - type: input
    id: version
    attributes:
      label: Version de lightning-lcd
    validations:
      required: true
