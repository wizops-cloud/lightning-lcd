name: Untested hardware report · Retour sur un matériel non testé
description: Does your card have a 0db0:7880 to 0db0:7919 screen other than 0db0:7881? Tell us what works. · Votre carte a un écran autre que 0db0:7881 ? Dites-nous ce qui marche.
labels: ["matériel"]
body:
  - type: markdown
    attributes:
      value: |
        Only the `0db0:7881` screen (MSI RTX 5090 Lightning Z) has been tested. The other IDs
        declared by the Windows driver are only driven with `--any-supported-pid` (or
        `any_supported_pid = true` in `[output]`). Remove any personal data (host name, `/home/…`
        paths, serial numbers).

        **Do not try anything other than the commands below**: lightning never writes to the
        flash memory of the screen.

        Seul l'écran `0db0:7881` (MSI RTX 5090 Lightning Z) a été testé. Les autres identifiants
        déclarés par le pilote Windows ne sont pilotés qu'avec `--any-supported-pid` (ou
        `any_supported_pid = true` dans `[output]`). Retirez toute donnée personnelle (nom de
        machine, chemins `/home/…`, numéros de série).

        **Ne tentez rien d'autre que les commandes ci-dessous** : lightning n'écrit jamais dans
        la mémoire flash de l'écran.
  - type: input
    id: carte
    attributes:
      label: Exact graphics card model · Modèle exact de la carte graphique
      placeholder: MSI GeForce RTX 50xx …
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: USB ID of the screen · Identifiant USB de l'écran
      description: "Output of `lsusb -d 0db0:` (VID:PID, no serial number). · Sortie de `lsusb -d 0db0:` (VID:PID, sans numéro de série)."
      placeholder: "ID 0db0:78xx Micro Star International …"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Firmware state · État du firmware
      description: "Output of `lightning --any-supported-pid status` (service stopped), without the serial number line. · Sortie de cette commande (service arrêté), sans la ligne du numéro de série."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: essais
    attributes:
      label: What works · Ce qui fonctionne
      description: "With `--any-supported-pid` and the service stopped. · Avec `--any-supported-pid` et le service arrêté."
      options:
        - label: "`lightning --any-supported-pid color ff0000` shows red · affiche du rouge"
        - label: "`lightning --any-supported-pid dashboard` shows the dashboard · affiche le tableau de bord"
        - label: "`lightning --any-supported-pid brightness 50` changes the brightness · change la luminosité"
        - label: "`lightning --any-supported-pid restore` brings back the original animation · rend l'animation d'origine"
        - label: The screen resolution is indeed 1280 × 800 · La résolution de l'écran est bien 1280 × 800
  - type: input
    id: resolution
    attributes:
      label: Actual screen resolution (if different) · Résolution réelle de l'écran (si différente)
  - type: textarea
    id: journaux
    attributes:
      label: Logs · Journaux
      description: "The failing command run again with `-vv`. · La commande qui pose problème relancée avec `-vv`."
      render: text
  - type: input
    id: version
    attributes:
      label: lightning-lcd version · Version de lightning-lcd
    validations:
      required: true
