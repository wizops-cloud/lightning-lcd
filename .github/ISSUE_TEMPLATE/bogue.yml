name: Signaler un bogue
description: Quelque chose ne marche pas comme prévu (écran, démon, application).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Retirez de vos journaux et captures toute donnée personnelle (nom de machine,
        chemins `/home/…`, numéros de série). Pour une faille de sécurité, suivez plutôt
        [SECURITY.md](https://github.com/wizops-cloud/lightning-lcd/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. lightning ctl mode slideshow
        2. …
    validations:
      required: true
  - type: input
    id: carte
    attributes:
      label: Modèle de carte graphique
      placeholder: MSI GeForce RTX 5090 32G Lightning Z
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: Identifiant USB de l'écran
      description: "Sortie de `lsusb -d 0db0:` (VID:PID, sans numéro de série)."
      placeholder: "Bus 001 Device 004: ID 0db0:7881 Micro Star International …"
    validations:
      required: true
  - type: textarea
    id: firmware
    attributes:
      label: État et versions du firmware
      description: |
        Sortie de `lightning ctl status` (démon lancé) ou de `lightning status` (service arrêté).
      render: text
  - type: input
    id: version
    attributes:
      label: Version de lightning-lcd
      description: "`lightning --version`, ou le commit si construit depuis les sources."
    validations:
      required: true
  - type: input
    id: systeme
    attributes:
      label: Distribution, bureau et noyau
      placeholder: Fedora 43, GNOME 49 (Wayland), noyau 6.17
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Depuis les sources (cargo)
        - Archive de release
        - RPM / COPR
        - Flatpak (application seule)
        - Autre
  - type: textarea
    id: journaux
    attributes:
      label: Journaux
      description: "`journalctl --user -u lightning-dashboard -b`, ou la commande relancée avec `-vv`."
      render: text
