<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning LCD — aperçu</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #090b10; color: #ecf0f7; font: 15px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  h1 { font-size: 18px; margin: 0; }
  .pill { padding: 2px 10px; border-radius: 999px; background: #283040; }
  .pill.connected { background: #1f5f2a; } .pill.absent, .pill.reconnecting { background: #7a2626; }
  .pill.connecting { background: #7a5a16; }
  #stage { width: min(96vw, 1280px); aspect-ratio: 1280 / 800; display: grid; place-items: center; }
  #stage.portrait { aspect-ratio: 800 / 1280; width: min(96vw, 60vh); }
  #screen { width: 100%; border-radius: 8px; box-shadow: 0 0 0 1px #283040; background: #000; }
  #stage.portrait #screen { width: 160%; }
  pre { color: #8c96a8; margin: 0; white-space: pre-wrap; text-align: center; }
  select, a { color: inherit; background: #141923; border: 1px solid #283040; border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
<header>
  <h1>Lightning LCD — aperçu</h1>
  <span id="lcd" class="pill">écran : ?</span>
  <label>orientation
    <select id="rot"><option>0</option><option>90</option><option>180</option><option>270</option></select>
  </label>
  <a href="/frame.png">frame.png</a> <a href="/frame.jpg">frame.jpg</a> <a href="/status.json">status.json</a>
</header>
<div id="stage"><img id="screen" src="/stream.mjpg" alt="flux de l'écran"></div>
<pre id="stats">…</pre>
<script>
const labels = {disabled: "désactivé", connecting: "connexion…", connected: "connecté",
                reconnecting: "reconnexion…", absent: "absent"};
const rot = document.getElementById("rot"), stage = document.getElementById("stage"),
      screen = document.getElementById("screen");
rot.onchange = () => {
  const deg = Number(rot.value);
  stage.classList.toggle("portrait", deg % 180 !== 0);
  screen.style.transform = `rotate(${deg}deg)`;
};
async function refresh() {
  try {
    const s = await (await fetch("/status.json")).json();
    const lcd = document.getElementById("lcd");
    lcd.className = "pill " + s.lcd.state;
    lcd.textContent = "écran : " + (labels[s.lcd.state] || s.lcd.state);
    lcd.title = s.lcd.detail;
    document.getElementById("stats").textContent =
      `${s.command} → ${s.outputs.join(", ")} · ${s.fps.toFixed(1)} img/s · rendu ${s.render_ms.toFixed(1)} ms` +
      ` · JPEG ${(s.jpeg_bytes / 1024).toFixed(0)} Ko · ${s.frames} images` +
      ` · écran : ${s.lcd.frames_sent} envoyées, ${s.lcd.errors} erreurs, ${s.lcd.reconnects} reconnexions` +
      (s.lcd.detail ? `\n${s.lcd.detail}` : "");
  } catch (e) {
    document.getElementById("stats").textContent = "serveur injoignable";
  }
}
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
