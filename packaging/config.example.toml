# Example configuration: copy it to ~/.config/lightning/config.toml
# Every key is optional; the values below are the defaults.
# Version française : config.example.fr.toml

[dashboard]
# Frames per second sent to the screen (0.1 to 30).
fps = 2.0
# JPEG quality (1 to 100).
quality = 85
# Software rotation of the picture, clockwise: 0, 90, 180 or 270.
# At 90 and 270, contents are laid out in portrait (800 × 1280), then rotated.
rotation = 0
# Screen brightness applied at startup (0 to 100). Uncomment to enable.
# brightness = 80
# Panels shown.
widgets = ["gpu", "cpu", "memory", "disks", "network"]
# Mount points of the disks panel.
disks = ["/", "/home"]
# Network interface to follow; by default the sum of the physical interfaces.
# interface = "eth0"
# Number of points in the small history graphs.
history = 120

[output]
# Active outputs: "lcd" (the real screen), "window" (preview window), "http" (browser).
outputs = ["lcd"]
# Address of the preview server ("http" output). 127.0.0.1 = this machine only.
http_addr = "127.0.0.1:7881"
# Debug banner in the preview window (O key to toggle).
overlay = true
# Simulated rotation in the preview window: 0, 90, 180 or 270 (R key).
preview_rotation = 0
# On exit: "keep" (last picture), "blank" (black "stopped" screen),
# "restore" (hands the screen back to the firmware: original MSI animation).
on_exit = "keep"
# Also accept the USB screens 0db0:7880 to 0db0:7919, declared by the Windows driver
# but never tested (default: 0db0:7881 only). Same as --any-supported-pid.
any_supported_pid = false

# Content shown by the daemon (`lightning daemon`), changed live from the settings
# application or `lightning ctl`.
[daemon]
# "dashboard", "image", "video", "color", "slideshow", "clock", "now_playing" or "msi_animation".
mode = "dashboard"
# Picture of the "image" mode (absolute path) and how it fits: "cover", "contain", "stretch".
image_path = ""
image_fit = "cover"
# Video of the "video" mode (absolute path or URL readable by ffmpeg), looped or not.
video_path = ""
video_loop = true
# Colour of the "color" mode (RRGGBB).
color = "101418"

# "slideshow" mode: photo slideshow.
[slideshow]
# Folders scanned recursively (JPEG, PNG, WebP, BMP; HEIC if built with the heic
# feature). The Google Photos cache (~/.cache/lightning/google-photos) is added
# automatically after an import.
folders = []
# How long each photo is shown, in seconds.
interval_s = 15.0
# "random" or "chronological" (EXIF capture date, otherwise file date).
order = "random"
# "cover" (fill and crop) or "contain" (whole photo on a blurred background).
fit = "contain"
# Cross-fade between two photos, in milliseconds (0 = none).
transition_ms = 600
# Caption (date and album) and small clock.
overlay = true
clock = true

# "clock" mode: full-screen clock and date.
[clock]
# Show seconds.
seconds = false
# Show the date below the time.
date = true

# "now_playing" mode: current track (MPRIS-compatible players: Spotify,
# Rhythmbox, Lollypop, browsers…).
[now_playing]
# Preferred player: part of its MPRIS name ("spotify", "firefox"…); empty = the first one playing.
player = ""

# Google Photos import (Picker API): OAuth client of type "desktop application"
# created in your Google Cloud Console (see the README).
[google]
client_id = ""
client_secret = ""
