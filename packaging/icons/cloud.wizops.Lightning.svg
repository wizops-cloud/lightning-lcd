<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône de l'application Lightning : un petit écran sombre, un éclair ambre. Dessin original. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3347"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f7bd45"/>
      <stop offset="1" stop-color="#e8912a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b441" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f2b441" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tuile -->
  <rect x="8" y="10" width="112" height="108" rx="26" fill="#05070b" opacity="0.35"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="110.5" height="106.5" rx="25.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- écran 16:10 -->
  <rect x="20" y="28" width="88" height="56" rx="9" fill="url(#screen)" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
  <ellipse cx="64" cy="56" rx="34" ry="26" fill="url(#glow)"/>
  <!-- petits indicateurs, comme sur un tableau de bord -->
  <rect x="27" y="35" width="18" height="4" rx="2" fill="#54a6ff" opacity="0.85"/>
  <rect x="27" y="43" width="11" height="4" rx="2" fill="#8c96a8" opacity="0.6"/>
  <rect x="87" y="65" width="4" height="12" rx="2" fill="#2dd4bf" opacity="0.9"/>
  <rect x="94" y="59" width="4" height="18" rx="2" fill="#b289ff" opacity="0.9"/>
  <rect x="80" y="70" width="4" height="7" rx="2" fill="#8c96a8" opacity="0.6"/>
  <!-- éclair -->
  <path d="M70 31 L49 60 h12 l-6 22 24 -32 h-13 z" fill="url(#bolt)" stroke="#3a2400" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- pied -->
  <rect x="46" y="92" width="36" height="7" rx="3.5" fill="#ffffff" opacity="0.16"/>
</svg>
